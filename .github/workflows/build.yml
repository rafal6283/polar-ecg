name: Zbuduj APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'ios/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analiza kodu
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testy
        # Wynik testów widać w logu; nie blokują wydania.
        continue-on-error: true
        run: flutter test
      - name: APK
        run: |
          set -o pipefail
          BN=$((100 + ${{ github.run_number }}))
          flutter build apk --release --build-number=$BN 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk polar-ekg.apk
          flutter build apk --release --build-number=$BN --split-per-abi --target-platform android-arm64 2>&1 | tee -a build.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk polar-ekg-arm64.apk
      - name: Błędy kompilacji jako adnotacje
        if: failure()
        run: |
          grep -E "^e: |error:|Error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Polar EKG build ${{ github.run_number }}
          body: |
            Automatyczny build z `${{ github.sha }}`.
            - **polar-ekg-arm64.apk** (~20 MB) – dla typowego telefonu z Androidem.
            - **polar-ekg.apk** – uniwersalny, gdyby arm64 się nie zainstalował.
          files: |
            polar-ekg-arm64.apk
            polar-ekg.apk
          make_latest: true
