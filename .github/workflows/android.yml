# Budowanie APK w chmurze GitHuba: testy -> APK (arm64 + uniwersalny) -> wydanie (Release) do pobrania
# na telefonie. Uruchamiane po pushu na main / main-5zheht albo ręcznie (Actions -> Android APK -> Run workflow).
name: Android APK

on:
  push:
    branches: [main, main-5zheht]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write # tworzenie wydań z plikami APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Zależności
        run: flutter pub get

      - name: Analiza statyczna
        run: flutter analyze

      - name: Testy
        run: flutter test

      - name: Wersja
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          # Numer kompilacji rośnie z każdym przebiegiem -> kolejne APK instalują się jako aktualizacja.
          BUILD=$((100 + ${{ github.run_number }}))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-b$BUILD" >> "$GITHUB_OUTPUT"

      - name: APK arm64 (telefony z ostatnich lat, ~20 MB)
        run: >
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.build }}

      - name: APK uniwersalny (gdyby arm64 nie zainstalował się)
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.build }}

      - name: Pliki wydania
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/polar-ekg-${{ steps.ver.outputs.tag }}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/polar-ekg-${{ steps.ver.outputs.tag }}-universal.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: polar-ekg-${{ steps.ver.outputs.tag }}
          path: dist/*.apk
          retention-days: 30

      - name: Wydanie (Releases) do pobrania na telefonie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Polar EKG ${{ steps.ver.outputs.name }} (kompilacja ${{ steps.ver.outputs.build }}, ${{ github.ref_name }})" \
            --notes "Gałąź ${{ github.ref_name }}, commit ${{ github.sha }}. Na telefon: plik *-arm64.apk (jeśli się nie zainstaluje – *-universal.apk)." \
            ${{ github.ref_name != 'main' && '--prerelease' || '' }}
